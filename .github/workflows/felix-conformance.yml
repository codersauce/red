name: Felix conformance

on:
  push:
    branches: [fcoury/felix-core]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  HX_PIN: a05c151bb6e8e9c65ec390b0ae2afe7a5efd619b
  ARCHIVE: helix-25.07.1-x86_64-linux.tar.xz

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ripgrep
        uses: ./.github/actions/install-ripgrep
      - name: Ensure tmux is available for terminal comparisons
        run: |
          if ! command -v tmux; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y tmux
          fi
      - name: Check benchmark trace parsing
        run: python3 -m unittest discover -s scripts -p test_perf_trace.py
      - name: Check out pinned Helix
        uses: actions/checkout@v4
        with:
          repository: helix-editor/helix
          ref: ${{ env.HX_PIN }}
          path: reference
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            reference
      - name: Build reference observer
        working-directory: reference
        env:
          HELIX_DISABLE_AUTO_GRAMMAR_BUILD: 1
          RUSTUP_TOOLCHAIN: stable
        run: |
          test "$(git rev-parse HEAD)" = "$HX_PIN"
          git apply ../scripts/felix/helix-observer.patch
          cargo build --locked -p helix-term --bin hx
      - name: Verify ordinary Red build and configuration
        run: |
          cargo build --locked --bin red
          export XDG_CONFIG_HOME="$RUNNER_TEMP/felix-config"
          mkdir -p "$XDG_CONFIG_HOME/red"
          target/debug/red --check-config
          if target/debug/red --check-config -c editing_model=helix > "$RUNNER_TEMP/config-error" 2>&1; then exit 1; fi
          grep -F -- '--features helix' "$RUNNER_TEMP/config-error"
          cargo tree --locked -p red --edges normal --prefix none > "$RUNNER_TEMP/red-tree"
          if grep -Eq '^felix-core v[0-9]' "$RUNNER_TEMP/red-tree"; then exit 1; fi
          cargo clippy --locked -p red --all-targets -- -D warnings
          cargo test --locked -p red --lib --test completion --test editing -- --test-threads=1
      - name: Fetch release and build candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 25.07.1 --repo helix-editor/helix --pattern "$ARCHIVE"
          cargo build --locked --features helix --bin red
      - name: Compare terminals and check reference fixture
        run: |
          mkdir -p evidence
          python3 scripts/felix/reference_smoke.py "$ARCHIVE" --observer reference/target/debug/hx --candidate target/debug/red > evidence/terminal.json
      - name: Verify ordinary keys reuse the visible README image
        run: |
          image_line=$(grep -nF '](docs/images/editor-overview.jpg)' README.md | cut -d: -f1)
          for scenario in typing vertical; do
            line=4
            if [ "$scenario" = vertical ]; then line=$((image_line - 1)); fi
            python3 scripts/felix/input_bench.py --binary target/debug/red --model helix \
              --scenario "$scenario" --source README.md --source-asset docs/images/editor-overview.jpg \
              --line "$line" --rows 94 --cols 152 --events 12 --warmup 4 --perf-mode trace \
              --config-override markdown_images=kitty --verify-image-reuse > "evidence/image-$scenario.json"
          done
      - name: Verify typed Helix signature-help triggers in the terminal
        run: |
          python3 scripts/interaction_bench.py signature --binary target/debug/red \
            --root "$PWD" --config-override editing_model=helix --cycles 4 > evidence/signature-help.txt
      - name: Verify multi-selection edits reach the language server
        run: |
          python3 scripts/edit_replay_bench.py --binary target/debug/red --scenario felix-change \
            --lines 300 --block-rows 8 --lsp incremental --split --unicode > evidence/lsp.json
      - name: Compare deterministic reference events and run Red regressions
        env:
          FELIX_SCENARIOS: ${{ github.workspace }}/evidence/scenarios.json
        run: |
          tar -xJf "$ARCHIVE" helix-25.07.1-x86_64-linux/runtime
          python3 scripts/felix/scenarios.py --observer reference/target/debug/hx --runtime helix-25.07.1-x86_64-linux/runtime --steps 48 --seed 250701 > "$FELIX_SCENARIOS"
          python3 scripts/felix/check_coverage.py "$FELIX_SCENARIOS" --terminal evidence/terminal.json >> "$GITHUB_STEP_SUMMARY"
          cmp scripts/felix/fixtures/motions.json "$FELIX_SCENARIOS"
          for suite in registers macros structure shell navigation comments increments; do
            python3 scripts/felix/scenarios.py --observer reference/target/debug/hx --runtime helix-25.07.1-x86_64-linux/runtime --suite "$suite" > "evidence/$suite.json"
            cmp "scripts/felix/fixtures/$suite.json" "evidence/$suite.json"
          done
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked -p felix-core
          cargo test --locked -p red --features helix --lib --test completion --test editing --test mouse_selection_detached --test lsp_save -- --test-threads=1
          cargo test --locked -p red --features helix --test lsp_lazy
          cargo test --locked -p red --features helix --test detach helix_primary_clipboard
          cargo test --locked -p red --features helix --test rpc_connection
      - name: Exercise native primary and system clipboards on an isolated X display
        run: |
          if ! command -v Xvfb || ! command -v xauth; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y xvfb xauth
          fi
          xvfb-run -a cargo test --locked -p red --features helix --lib native_primary_selection_is_independent_of_system_clipboard -- --ignored
      - name: Replay the extended seed against the same revision
        if: github.event_name != 'pull_request'
        env:
          FELIX_SCENARIOS: ${{ github.workspace }}/evidence/extended.json
        run: |
          python3 scripts/felix/scenarios.py --observer reference/target/debug/hx --runtime helix-25.07.1-x86_64-linux/runtime --steps 512 --seed "$GITHUB_RUN_ID" > "$FELIX_SCENARIOS"
          python3 scripts/felix/check_coverage.py "$FELIX_SCENARIOS" --terminal evidence/terminal.json >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked -p felix-core --test reference
          cargo test --locked -p red --features helix --lib editor::felix::tests::motions_match_reference_at_every_key
      - name: Record candidate and reference identities
        run: |
          git rev-parse HEAD > evidence/candidate-commit.txt
          git -C reference rev-parse HEAD > evidence/reference-commit.txt
          sha256sum Cargo.lock "$ARCHIVE" reference/target/debug/hx target/debug/red \
            scripts/felix/helix-observer.patch scripts/felix/coverage.toml scripts/felix/broad_cases.py \
            scripts/felix/tutor_{picker,splits}.py scripts/felix/fixtures/{motions,registers,macros,structure,navigation,shell,comments,increments}.json scripts/felix/*baseline.json \
            default_config.toml src/editor/felix_bindings.toml > evidence/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: felix-conformance
          path: evidence/

  cm6-cases:
    # Replays helix-cm6's generated key sequences against Helix 25.07.1 and Red.
    # Pull requests run the hand suite and one fuzz seed; pushes and nightly runs
    # add the other seeds. scripts/felix/cm6/baseline.txt lists known differences.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
      - name: Restore Helix results
        uses: actions/cache@v4
        with:
          path: ~/.cache/red-felix/cm6/expected-*.json
          key: felix-cm6-${{ github.event_name == 'pull_request' && 'pr' || 'full' }}-${{ hashFiles('scripts/felix/cm6/oracle.rs', 'scripts/felix/cm6/run.py', 'scripts/felix/cm6/export.ts') }}
      - name: Compare with Helix
        env:
          SUITES: ${{ github.event_name == 'pull_request' && 'hand fuzz:1' || 'hand fuzz:1 fuzz:2 fuzz:3 fuzz:4 fuzz:5' }}
        run: |
          mkdir -p evidence
          python3 scripts/felix/cm6/run.py --report evidence/cm6-report.json $SUITES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: felix-cm6
          path: evidence/
