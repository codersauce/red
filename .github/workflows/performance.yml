name: Performance

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/performance.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/husk*/**'
      - 'examples/husk_cursor_bench.rs'
      - 'plugins/**'
      - 'src/**'
      - 'default_config.toml'
      - 'vendor/crossterm/**'
      - 'tools/navigation-bench/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/performance.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/husk*/**'
      - 'examples/husk_cursor_bench.rs'
      - 'plugins/**'
      - 'src/**'
      - 'default_config.toml'
      - 'vendor/crossterm/**'
      - 'tools/navigation-bench/**'
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  perf:
    name: Deterministic performance gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-unknown-linux-gnu

      - name: Check bundled Husk callback budget
        run: cargo run --locked --release --example husk_cursor_bench -- --assert

  navigation:
    name: Native navigation replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: navigation-release
      - name: Build Red and the native terminal driver
        run: |
          cargo build --locked --release --bin red
          cargo build --locked --release --manifest-path tools/navigation-bench/Cargo.toml --target-dir target
      - name: Compare incremental navigation with full rendered frames
        run: cargo test --locked --release --lib editor::navigation_perf_tests::
      - name: Check every displayed position and saved document
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          for scenario in inside scroll reverse window buffer; do
            target/release/red-navigation-bench"$suffix" --binary target/release/red"$suffix" \
              --scenario "$scenario" --presses 64 --interval-ms 5
          done
