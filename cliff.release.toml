[changelog]
header = """
## What's Changed

"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
{% set message = commit.message | split(pat="\n") | first | trim -%}
{% if commit.remote.pr_number -%}
{% set pr_suffix = " (#" ~ commit.remote.pr_number ~ ")" -%}
{% set message = message | replace(from=pr_suffix, to="") -%}
{% endif -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ message | upper_first }}{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}{% if commit.remote.pr_number %} in #{{ commit.remote.pr_number }}{% endif %}
{%- endfor %}

{% endfor %}
{% if github.contributors %}
## Contributors
{% for contributor in github.contributors %}
- @{{ contributor.username }}{% if contributor.pr_number %} in #{{ contributor.pr_number }}{% endif %}{% if contributor.is_first_time %} (first-time contributor){% endif %}
{%- endfor %}
{% endif %}
"""
trim = true
postprocessors = [
  { pattern = ' by @[^[:space:]]+\[bot\]', replace = "" },
  { pattern = '\n- @[^[:space:]]+\[bot\][^\n]*', replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
  # A cherry-pick trailer is provenance, not release-note text.
  { pattern = '\s*\(cherry picked from commit [0-9a-f]{7,40}\)', replace = "" },
]
tag_pattern = "v[0-9].*"
sort_commits = "newest"

commit_parsers = [
  # Unprefixed commits that landed on main; group them by what they changed.
  { sha = "4906e4fc14bbfb53ef57f3dd5aa8706c140fbb72", group = "<!-- 01 -->Performance" },
  { sha = "6706f4194acbcc71eaa00b9c58ce756ab911adcb", group = "<!-- 01 -->Performance" },
  { message = "^Merge", skip = true },
  { message = "^chore\\(release\\): prepare v", skip = true },
  { message = "^almanac", skip = true },
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^perf", group = "<!-- 01 -->Performance" },
  { message = "^fix", group = "<!-- 02 -->Bug Fixes" },
  { message = "^refactor", group = "<!-- 03 -->Refactoring" },
  { message = "^docs", group = "<!-- 04 -->Documentation" },
  { message = "^test", group = "<!-- 05 -->Tests" },
  { message = "^chore", group = "<!-- 06 -->Maintenance" },
  { message = ".*", group = "<!-- 07 -->Other" },
]
