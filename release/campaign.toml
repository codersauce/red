schema_version = 1
version = "0.9.1"
headline = "More reliable completion, symbol search, and plugins"
summary = "Red v0.9.1 fixes completion after punctuation and keeps large language-server results from stopping plugins. It also makes plugin failures easier to diagnose and improves terminal command output."
website = "https://github.com/codersauce/red/releases/latest"

x_post = """{launch}. Fixes for completion after punctuation and large symbol searches, clearer plugin startup and failure messages, and an in-editor plugin status view.

{url}"""
bluesky_post = """{launch}. A maintenance release for completion, large symbol searches, and plugin memory handling. Inspect current-session plugin state with :plugin-status, and get clearer startup and failure messages.

{url}"""

[[stories]]
id = "punctuation-completion"
title = "Keep member completion working as you type"
summary = "Typing through a completion and continuing with punctuation preserves the period and requests members after the updated text reaches the language server. Late completion responses no longer discard punctuation or dismiss the new member menu."
status = "improved"
pull_requests = [390]
channels = ["github", "discord", "x", "bluesky", "in_app"]

[[stories]]
id = "large-symbol-results"
title = "Search large symbol lists without stopping the plugin"
summary = "Large symbol and reference results are trimmed to fit the receiving plugin's memory budget, with the original count retained for truncated-result messages. Other oversized request results produce a warning rather than stopping the plugin. Shared arrays and maps are counted once against the Husk heap while new copies still respect the limit."
status = "improved"
pull_requests = [393, 398, 399]
channels = ["github", "discord", "in_app"]

[[stories]]
id = "plugin-diagnostics"
title = "Inspect plugin state and understand startup failures"
summary = "Run :plugin-status to inspect plugins in the current editor session, including starting, active, disabled, and quarantined states. Startup notices explain pending commands, executable failures retain their cause, and commands from stopped plugins explain why they are unavailable."
status = "new"
pull_requests = [396, 400]
channels = ["github", "discord", "in_app"]

[[stories]]
id = "terminal-output"
title = "Read terminal command output more easily"
summary = "Plugin lists and catalog results use aligned columns measured in terminal display width, including Unicode text. Utility commands share consistent styling, and closed output pipes exit quietly."
status = "improved"
pull_requests = [391]
channels = ["github", "discord", "in_app"]
