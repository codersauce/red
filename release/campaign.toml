[[stories]]
id = "multiple-language-servers"
title = "Use TypeScript and ESLint together"
summary = "Attach multiple configured language servers to the same document. Diagnostics and code actions are combined, while completion, hover, and navigation use a capable server. Install the server executables and configure ESLint in Red's user config; attachment is automatic afterward. External Prettier formatting keeps its precedence."
status = "new"
pull_requests = [383]
channels = ["github", "discord", "x", "bluesky", "in_app"]

[[stories]]
id = "json-rpc-plugins"
title = "Write plugins in your language"
summary = "Run external plugins as supervised JSON-RPC processes over stdio. Plugins can contribute commands, panels, pickers, statusline content, and revision-checked document edits, with owner-scoped configuration and storage. Existing Husk plugins remain supported."
status = "new"
pull_requests = [380]
channels = ["github", "discord", "x", "bluesky", "in_app"]

[[stories]]
id = "json-workbench"
title = "Query and transform JSON with JSON Workbench"
summary = "Install the example plugin to run jq filters against a pinned document or selection, edit queries with live previews, explore results, and apply or undo checked transformations. Saved query history, result documents, and copying are included. Requires Python 3.9 or newer and jq on PATH; the plugin is installed separately."
status = "new"
pull_requests = [381]
channels = ["github", "discord", "x", "bluesky", "in_app"]

