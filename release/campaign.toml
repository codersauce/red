schema_version = 1
version = "0.12.0"
headline = "Find in Files without ripgrep, and new ways to install Red"
summary = "Red v0.12.0 bundles FFF for Find in Files, so project-wide search works on a fresh install with nothing else on PATH, and both search pickers now show which filters are on. Red can also be installed with Nix, Scoop, or a DEB or RPM package."
website = "https://github.com/codersauce/red/releases/latest"

x_post = """{launch}. Find in Files now runs on bundled FFF, so search works without ripgrep installed, and the pickers show which filters are on. Red also installs with Nix, Scoop, and DEB or RPM packages.

{url}"""
bluesky_post = """{launch}. Find in Files runs on bundled FFF: no ripgrep needed, and repeated searches use a background index. The search pickers show active filters, and Red now installs with Nix, Scoop, or a DEB or RPM package.

{url}"""

[[stories]]
id = "bundled-search"
title = "Find in Files without ripgrep"
summary = "Space g searches with FFF built into Red instead of launching rg, so it works on a fresh install with no external tools and an empty process allowlist. A background index skips files that cannot match, ignore rules are checked on every query, and the first matching line appears as soon as it is found. On Red's own checkout on macOS, a typical search completes in 11 ms, against 22 ms with rg. Smart case, regex and literal search, and Unicode-correct jumps to the match all work as before."
status = "improved"
pull_requests = [438]
channels = ["github", "discord", "x", "bluesky", "in_app"]

[[stories]]
id = "search-filter-badges"
title = "See which search filters are on"
summary = "When a filter changes what a picker searches, its name appears on the picker's footer line, next to the result count: +hidden and +ignored after Alt-h and Alt-i in Find in Files or Ctrl-e in the file picker, +symlinks after Alt-f, and literal when Alt-r turns regex off. Default settings show nothing, so the footer stays clear until a filter is on."
status = "new"
pull_requests = [440]
channels = ["github", "discord", "in_app"]

[[stories]]
id = "packages"
title = "Install with Nix, Scoop, DEB, or RPM"
summary = "nix run github:codersauce/red runs Red from its flake on Linux and Apple Silicon macOS. On Windows, scoop bucket add codersauce https://github.com/codersauce/red and then scoop install codersauce/red-editor. Each release now includes DEB and RPM packages for x86-64 Linux. These packages install the command as red-editor, so it does not clash with the red command from GNU ed."
status = "new"
pull_requests = [439]
channels = ["github", "discord", "x", "bluesky", "in_app"]
