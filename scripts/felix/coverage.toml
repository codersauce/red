# A case with a trace covers the recorded input sequence. Open items remain M1 work.
schema = 1
reference = "a05c151bb6e8e9c65ec390b0ae2afe7a5efd619b"
fields = ["key", "document", "text", "mode", "ranges", "primary", "pending", "count", "search", "unnamed"]

[[area]]
name = "Modes and pending input"
cases = ["typed-selection", "reverse-at-eof", "empty-rope"]
remaining = ["Complete mode/count/argument/cancellation matrix"]

[[area]]
name = "Movement and navigation"
cases = ["word-boundaries", "character-arguments", "vertical-goal", "selection-jumplist", "jump-follows-edit", "motion-seed-{seed}"]
remaining = ["Wrapped visual motion", "Viewport paging", "All aliases and repeated motions"]

[[area]]
name = "Selections"
cases = ["line-selections", "keep-and-rotate", "regex-select-split-keep", "paragraph-and-copies"]
remaining = ["Full count and direction matrix for merging, trimming, copying and filtering"]

[[area]]
name = "Search"
cases = ["search-and-navigate"]
remaining = ["Invalid patterns, prompt cancellation and search from multiple selections"]

[[area]]
name = "Text objects"
cases = ["explicit-objects"]
remaining = ["Delimiters, nesting, counts and failure on unmatched objects"]

[[area]]
name = "Editing and clipboard"
cases = ["yank-paste-replace", "whole-line-change", "indent-join"]
remaining = ["Clipboard failure and counts", "Language-specific indentation and joins"]

[[area]]
name = "Insert behavior"
cases = ["open-line", "auto-pairs", "insert-controls"]
