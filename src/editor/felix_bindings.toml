# Native document-window actions. Editing commands are resolved by felix-core.
[normal]
"=" = "FelixFormatRange"
"Alt-m" = { PluginCommand = "AgentModel" }
"Alt-w" = { PluginCommand = "AgentClose" }
"Alt-y" = "ScrollDown"
"Ctrl-y" = "ScrollUp"
"Ctrl-Shift-p" = "CommandPalette"

[normal." "]
y = "FelixClipboardYank"
Y = "FelixClipboardYankPrimary"
R = "FelixClipboardReplace"
p = "FelixClipboardAfter"
P = "FelixClipboardBefore"
f = "FilePicker"
a = "CodeAction"
e = { PluginCommand = "NeoTree" }
E = { PluginCommand = "NeoTreeDocumentDirectory" }
g = "FelixChangedFiles"
h = "FelixSymbolHighlights"
c = "FelixToggleComments"
C = "FelixBlockComments"
"Alt-c" = "FelixLineComments"
"=" = "FormatDocument"
b = { PluginCommand = "BufferPicker" }
"/" = { PluginCommand = "ProjectSearch" }
s = { PluginCommand = "LspDocumentSymbols" }
S = { PluginCommand = "LspWorkspaceSymbols" }
k = "Hover"
r = "StartRename"
d = "FelixDocumentDiagnostics"
D = "OpenDiagnosticsPicker"
"?" = "CommandPalette"
G = { PluginCommand = "GitDashboard" }
l = "OpenStatuslineManager"
L = "ListPlugins"
A = { PluginCommand = "Agent" }
m = "OpenMessages"
i = "InlineAssist"
V = "AddSampleInlineComment"
H = "OpenInlineHistory"
N = "OpenLatestInlineCompletion"
X = "ClearInlineComments"
v = "ShowInlineComment"
x = "DismissInlineComment"
t = { PluginCommand = "ThemeBrowser" }
z = { s = { PluginCommand = "GitHunkStage" }, u = { PluginCommand = "GitHunkUnstage" }, r = { PluginCommand = "GitHunkReset" }, c = { PluginCommand = "GitSubmitMessage" }, q = { PluginCommand = "GitCancelMessage" } }
B = { t = { PluginCommand = "AgentToggle" }, n = { PluginCommand = "AgentNew" }, s = { PluginCommand = "AgentSessions" }, c = { PluginCommand = "AgentClear" } }
o = { e = { ExploreCommand = "toggle" }, f = { ExploreCommand = "follow" }, "*" = { ExploreCommand = "follow" }, s = { ExploreCommand = "skeleton" }, d = { ExploreCommand = "definition" }, t = { ExploreCommand = "type" }, j = { ExploreCommand = "next" }, k = { ExploreCommand = "prev" }, b = { ExploreCommand = "back" }, n = { ExploreCommand = "forward" }, r = { ExploreCommand = "refresh" }, R = { ExploreCommand = "index" }, p = { ExploreCommand = "pr" }, "?" = { ExploreCommand = "help" }, q = { ExploreCommand = "close" } }

[normal.Ctrl-w]
"Ctrl-h" = "MoveWindowLeft"
Left = "MoveWindowLeft"
"Ctrl-j" = "MoveWindowDown"
Down = "MoveWindowDown"
"Ctrl-k" = "MoveWindowUp"
Up = "MoveWindowUp"
"Ctrl-l" = "MoveWindowRight"
Right = "MoveWindowRight"
"Ctrl-s" = "SplitHorizontal"
"Ctrl-v" = "SplitVertical"
"Ctrl-q" = "CloseWindow"
"Ctrl-o" = "OnlyWindow"
f = { FelixSplitAtFile = false }
F = { FelixSplitAtFile = true }
t = "FelixTransposeWindow"
"Ctrl-t" = "FelixTransposeWindow"
H = { FelixSwapWindow = "Left" }
J = { FelixSwapWindow = "Down" }
K = { FelixSwapWindow = "Up" }
L = { FelixSwapWindow = "Right" }
h = "MoveWindowLeft"
j = "MoveWindowDown"
k = "MoveWindowUp"
l = "MoveWindowRight"
w = "NextWindow"
"Ctrl-w" = "NextWindow"
s = "SplitHorizontal"
v = "SplitVertical"
q = "CloseWindow"
o = "OnlyWindow"
n = { s = "SplitHorizontalNewBuffer", "Ctrl-s" = "SplitHorizontalNewBuffer", v = "SplitVerticalNewBuffer", "Ctrl-v" = "SplitVerticalNewBuffer" }
e = { h = "MoveWindowToLeft", j = "MoveWindowToBottom", k = "MoveWindowToTop", l = "MoveWindowToRight" }

[insert]
"Alt-k" = "SignatureHelp"
"Ctrl-x" = "RequestCompletion"
"Ctrl-Space" = "RequestCompletion"
