schema_version = 1

[plugin]
id = "rpc-hello"
name = "RPC Hello"
version = "0.1.0"
red_api = "^0.21.0"

[rpc]
command = "python3"
args = ["plugin.py"]

[activation]
commands = ["RpcApply", "RpcConfig", "RpcDocument", "RpcHello", "RpcLastEvent", "RpcPanel", "RpcPanelClose", "RpcPicker", "RpcStatusline", "RpcStatuslineClear", "RpcStorage", "RpcStorageClear", "RpcUndo"]
events = ["file:saved"]
